<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dealey Plaza: 1963</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#20262a;font-family:system-ui,-apple-system,sans-serif;color:#fff}
#game{width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card{background:rgba(7,9,10,.68);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:9px 12px;font-size:12px;text-shadow:0 1px 2px #000}
.title{font-weight:800;font-size:14px;letter-spacing:.3px}.muted{opacity:.68}
#quality{pointer-events:auto;background:#111;color:#fff;border:1px solid #555;border-radius:8px;padding:5px}
#info{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);max-width:82%;text-align:center;white-space:nowrap}
#hint{position:absolute;bottom:18px;left:14px;font-size:11px;opacity:.5}
#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);opacity:.5}
#cross:before,#cross:after{content:'';position:absolute;background:#fff}
#cross:before{width:14px;height:1px;top:7px}.cross:after{height:14px;width:1px;left:7px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
<div class="top">
<div class="card"><div class="title">DEALEY PLAZA · 1963</div><div class="muted">Measured historical reconstruction / exploration</div></div>
<div class="card">Quality <select id="quality"><option>Cinematic</option><option selected>High</option><option>Balanced</option><option>Performance</option></select></div>
</div>
<div id="cross" class="cross"></div>
<div id="info" class="card">Loading measured Dealey Plaza geometry…</div>
<div id="hint">Touch: left side move · right side look</div>
</div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(()=> {
const B=window.BABYLON,canvas=document.getElementById('game'),info=document.getElementById('info'),quality=document.getElementById('quality');
if(!B){info.textContent='Renderer failed to load.';return}
const engine=new B.Engine(canvas,true,{antialias:true,preserveDrawingBuffer:false,stencil:true});
engine.enableOfflineSupport=false;
const scene=new B.Scene(engine);
scene.clearColor=new B.Color4(.53,.61,.67,1);
scene.fogMode=B.Scene.FOGMODE_EXP2;scene.fogColor=new B.Color3(.53,.61,.67);scene.fogDensity=.0018;
const camera=new B.UniversalCamera('Explorer',new B.Vector3(0,4,-32),scene);camera.setTarget(new B.Vector3(0,4,0));
camera.minZ=.08;camera.maxZ=1200;camera.speed=.18;camera.inertia=.8;camera.angularSensibility=3600;camera.attachControl(canvas,true);
const hemi=new B.HemisphericLight('Sky',new B.Vector3(0,1,0),scene);
hemi.intensity=.72;hemi.diffuse=new B.Color3(.88,.91,.95);hemi.groundColor=new B.Color3(.23,.26,.22);
const sun=new B.DirectionalLight('Sun',new B.Vector3(-.42,-1,.32),scene);
sun.position=new B.Vector3(180,240,130);sun.intensity=2.05;
const env=B.CubeTexture.CreateFromPrefilteredData('https://assets.babylonjs.com/environments/environmentSpecular.env',scene);
scene.environmentTexture=env;scene.environmentIntensity=.42;
const pipe=new B.DefaultRenderingPipeline('RealTime',true,scene,[camera]);
pipe.fxaaEnabled=true;pipe.imageProcessingEnabled=true;pipe.imageProcessing.exposure=1.0;pipe.imageProcessing.contrast=1.12;
pipe.bloomEnabled=true;pipe.bloomThreshold=.92;pipe.bloomWeight=.045;pipe.bloomKernel=32;
const shadow=new B.ShadowGenerator(1536,sun);shadow.useBlurExponentialShadowMap=true;shadow.blurKernel=18;shadow.bias=.0005;
const loadingWorld=[];
const loadMat=new B.StandardMaterial('LoadingWorldMaterial',scene);loadMat.diffuseColor=new B.Color3(.42,.36,.29);loadMat.specularColor=new B.Color3(.08,.08,.08);
const loadRoadMat=new B.StandardMaterial('LoadingRoadMaterial',scene);loadRoadMat.diffuseColor=new B.Color3(.12,.13,.13);
const loadGround=B.MeshBuilder.CreateGround('LoadingGround',{width:240,height:240},scene);loadGround.material=loadRoadMat;loadingWorld.push(loadGround);
const loadPlaza=B.MeshBuilder.CreateBox('LoadingPlaza',{width:52,height:.16,depth:42},scene);loadPlaza.position.y=.08;loadPlaza.material=loadRoadMat;loadingWorld.push(loadPlaza);
for(let i=-2;i<=2;i++){
 const h=9+(Math.abs(i)%3)*4;
 const b=B.MeshBuilder.CreateBox('LoadingBuilding',{width:12,height:h,depth:10},scene);b.position.set(i*16,h/2,18);b.material=loadMat;loadingWorld.push(b);
 const roof=B.MeshBuilder.CreateBox('LoadingRoof',{width:12.4,height:.3,depth:10.4},scene);roof.position.set(i*16,h+.15,18);roof.material=loadMat;loadingWorld.push(roof);
}
info.textContent='INITIALIZING HISTORICAL WORLD…';
// Guaranteed visible fallback scene while the measured map loads.


const mats={};
function M(n,c,r=.8,metal=0){const m=new B.PBRMaterial(n,scene);m.albedoColor=B.Color3.FromHexString(c);m.roughness=r;m.metallic=metal;m.environmentIntensity=.35;mats[n]=m;return m}
M('street','#272a2b',.97);M('sidewalk','#8d8a81',.92);M('stone','#b8ad95',.82);M('stone2','#8f8777',.9);
M('brick','#6f3e2d',.92);M('roof','#514c43',.95);M('grass','#526448',1);M('grass2','#667457',1);
M('water','#557783',.18,.05);M('glass','#17272e',.08,.15);M('metal','#202223',.38,.7);
M('tree','#3c5036',1);M('tree2','#526544',1);M('trunk','#493426',1);M('white','#ddd7c9',.7);
M('red','#741c18',.36,.12);M('cream','#c4b397',.5,.05);M('blue','#354b57',.5,.08);
M('interiorFloor','#6f6250',.92);M('interiorWall','#d8d0bd',.96);M('wood','#70563d',.82);M('cardboard','#9a6e3f',.96);M('iron','#3b3b37',.5,.65);

function makeBrickTexture(){
 const t=new B.DynamicTexture('BrickTexture',{width:1024,height:1024},scene,true);
 const c=t.getContext();c.fillStyle='#6f3e2d';c.fillRect(0,0,1024,1024);
 const bw=96,bh=42; c.strokeStyle='rgba(35,18,13,.48)';c.lineWidth=5;
 for(let y=0;y<1024;y+=bh){c.beginPath();c.moveTo(0,y);c.lineTo(1024,y);c.stroke();const off=(Math.floor(y/bh)%2)*bw/2;for(let x=-off;x<1024;x+=bw){c.beginPath();c.moveTo(x,y);c.lineTo(x,y+bh);c.stroke()}}
 t.update();return t;
}
const brickTexture=makeBrickTexture();mats.brick.albedoTexture=brickTexture;mats.brick.bumpTexture=brickTexture;mats.brick.bumpTexture.level=.16;

function matFor(kind){kind=(kind||'').toLowerCase();if(kind.includes('road'))return mats.street;if(kind.includes('foot'))return mats.sidewalk;if(kind.includes('grass'))return mats.grass;if(kind.includes('water'))return mats.water;return mats.stone}
function points(o){return o.outer||o.polygon||o.points||o.path||null}
function center(ps){let x=0,z=0;for(const p of ps){x+=p[0];z+=p[1]}return new B.Vector3(x/ps.length,0,z/ps.length)}
function poly(name,ps,y,h,material){
 if(!ps||ps.length<3)return null;
 const shape=ps.map(p=>new B.Vector3(p[0],p[1],0));
 try{
  const builder=new B.PolygonMeshBuilder(name,shape,scene);
  const mesh=builder.build(false,h||.02);mesh.rotation.x=-Math.PI/2;mesh.position.y=y;mesh.material=material;return mesh;
 }catch(e){
  return null;
 }
}
function lineMesh(name,ps,y,width,material){
 if(!ps||ps.length<2)return;
 const paths=[ps.map(p=>new B.Vector3(p[0],y,p[1]))];
 try{
  const ribbon=B.MeshBuilder.CreateRibbon(name,{pathArray:paths,closeArray:false,closePath:false,sideOrientation:B.Mesh.DOUBLESIDE},scene);
  ribbon.material=material;return ribbon;
 }catch(e){return null}
}
function treeAt(p,s=1,v=0){
 const x=p[0],z=p[1],tr=B.MeshBuilder.CreateCylinder('TreeTrunk',{diameter:.8*s,height:5*s,tessellation:10},scene);
 tr.position=new B.Vector3(x,2.5*s,z);tr.material=mats.trunk;
 for(let i=0;i<6;i++){
  const a=i*Math.PI/3;
  const f=B.MeshBuilder.CreateSphere('TreeCrown',{diameter:3.4*s,segments:10},scene);
  f.position=new B.Vector3(x+Math.cos(a)*1.25*s,5.2*s,z+Math.sin(a)*1.25*s);f.material=v?mats.tree2:mats.tree;
 }
}
function facade(root,base,height,width){
 const floors=Math.max(2,Math.min(8,Math.round(height/3.15)));
 const cols=Math.max(5,Math.min(18,Math.round(width/3.8)));
 for(let floor=0;floor<floors;floor++){
  const y=base+1.72+floor*3.08;
  const band=B.MeshBuilder.CreateBox('FacadeBand',{width:width,height:.16,depth:.24},scene);
  band.position.set(0,y-1.0,-.16);band.material=mats.stone2;band.parent=root;
  for(let i=0;i<cols;i++){
   const x=-width/2+width*(i+.5)/cols;
   const w=Math.min(2.35,width/cols*.70);
   const win=B.MeshBuilder.CreateBox('HistoricWindow',{width:w,height:1.82,depth:.12},scene);
   win.position.set(x,y,-.10);win.material=mats.glass;win.parent=root;
   const frameL=B.MeshBuilder.CreateBox('WindowMullion',{width:.09,height:1.92,depth:.18},scene);
   frameL.position.set(x-w/2+.08,y,-.18);frameL.material=mats.cream;frameL.parent=root;
   const frameR=frameL.clone('WindowMullionR');frameR.position.x=x+w/2-.08;
   const sill=B.MeshBuilder.CreateBox('StoneSill',{width:w+.30,height:.12,depth:.20},scene);
   sill.position.set(x,y-1.02,-.20);sill.material=mats.stone2;sill.parent=root;
   const lintel=B.MeshBuilder.CreateBox('StoneLintel',{width:w+.18,height:.14,depth:.20},scene);
   lintel.position.set(x,y+1.00,-.19);lintel.material=mats.stone2;lintel.parent=root;
  }
 }
 const cornice=B.MeshBuilder.CreateBox('HistoricCornice',{width:width+1.0,height:.42,depth:.42},scene);
 cornice.position.set(0,base+height-.25,-.18);cornice.material=mats.stone2;cornice.parent=root;
}
function detailedBuilding(b,idx){
 const ps=points(b);if(!ps)return;
 const c=center(ps);const h=Math.max(2,Math.min(80,b.height||8));
 const m=matFor(b.kind);
 const mesh=poly('MeasuredBuilding_'+idx,ps,0,h,m);if(!mesh)return;
 mesh.receiveShadows=true;
 // Add architectural depth only to the nearest buildings so the phone stays fast.
 const d=Math.hypot(c.x,c.z);
 if(d<115 && h>5){
  const root=new B.TransformNode('FacadeDetail_'+idx,scene);root.position=new B.Vector3(c.x,0,c.z);
  const w=Math.min(55,Math.max(12,Math.sqrt(ps.reduce((a,p)=>a+Math.hypot(p[0]-c.x,p[1]-c.z),0))));
  facade(root,0,h,w);
 }
 if(d<75){
  const roof=poly('Roof_'+idx,ps,h+.06,.10,mats.roof);
  if(roof)roof.receiveShadows=true;
 }
}
function car(x,z,r,c){
 const root=new B.TransformNode('PeriodSedan',scene);root.position=new B.Vector3(x,.8,z);root.rotation.y=r;
 const body=B.MeshBuilder.CreateBox('Body',{width:5.1,height:1.1,depth:2.0},scene);body.position.y=.55;body.material=mats[c];body.parent=root;
 const cabin=B.MeshBuilder.CreateBox('Cabin',{width:2.8,height:1.05,depth:1.75},scene);cabin.position.set(-.45,1.45,0);cabin.material=mats[c];cabin.parent=root;
 const glass=B.MeshBuilder.CreateBox('Glass',{width:2.45,height:.65,depth:1.8},scene);glass.position.set(-.2,1.48,0);glass.material=mats.glass;glass.parent=root;
 for(const sx of [-1.8,1.8])for(const sz of [-.82,.82]){const w=B.MeshBuilder.CreateCylinder('Wheel',{diameter:.92,height:.28,tessellation:18},scene);w.rotation.z=Math.PI/2;w.position.set(sx,.02,sz);w.material=mats.metal;w.parent=root}
}
function sign(text,pos){
 const p=B.MeshBuilder.CreatePlane('HistoricalSign',{width:4,height:1},scene);p.position.copyFrom(pos);p.rotation.y=Math.PI;
 const t=new B.DynamicTexture('SignText',{width:800,height:200},scene,true);t.hasAlpha=true;t.drawText(text,null,130,'bold 58px Arial','#eee8d8','transparent',true);
 const sm=new B.StandardMaterial('SignMaterial',scene);sm.diffuseTexture=t;sm.emissiveColor=new B.Color3(.12,.14,.13);p.material=sm;
}



// --- ADVANCED HISTORICAL BLOCK: Dealey Plaza presentation layer ---
function addRoadMarkings(){
 const lines=[[-90,0,90,0],[-90,0,90,0]];
 for(let i=-3;i<=3;i++){
  const z=i*7;
  const m=B.MeshBuilder.CreateBox('LaneMarker',{width:3.2,height:.018,depth:.16},scene);
  m.position.set(0,.012,z);m.material=mats.white;
 }
}
function addStreetFurniture(){
 const spots=[[-38,-18],[-28,22],[30,-12],[42,18]];
 for(const [x,z] of spots){
  const post=B.MeshBuilder.CreateCylinder('LampPost',{diameter:.18,height:4.2,tessellation:12},scene);
  post.position.set(x,2.1,z);post.material=mats.metal;
  const lamp=B.MeshBuilder.CreateSphere('Lamp',{diameter:.48,segments:12},scene);
  lamp.position.set(x,4.25,z);lamp.material=mats.white;
 }
}
function addHistoricCars(){
 car(-14,-8,.04,'cream');car(12,9,Math.PI,'blue');car(34,-5,.02,'red');
 car(-42,26,Math.PI*.52,'white');car(44,31,-Math.PI*.42,'cream');
}
function addPlazaPlanters(){
 for(const [x,z] of [[-18,-22],[18,-22],[-30,8],[30,8]]){
  const p=B.MeshBuilder.CreateCylinder('HistoricPlanter',{diameter:2.2,height:.75,tessellation:20},scene);
  p.position.set(x,.38,z);p.material=mats.stone2;
  const shrub=B.MeshBuilder.CreateSphere('PlanterShrub',{diameter:2.0,segments:12},scene);
  shrub.position.set(x,1.35,z);shrub.scaling.y=.7;shrub.material=mats.tree2;
 }
}

function addDepositoryUpgrade(building){
 const ps=points(building)||[]; if(ps.length<4)return null;
 let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
 for(const p of ps){minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);minZ=Math.min(minZ,p[1]);maxZ=Math.max(maxZ,p[1]);}
 const x=(minX+maxX)/2,z=(minZ+maxZ)/2,roomW=Math.max(24,Math.min(54,(maxX-minX)*.78)),roomD=Math.max(30,Math.min(62,(maxZ-minZ)*.72)),floorY=Math.max(11.5,(building.height||19.8)-3),wallH=4.3;
 const box=(n,o,m)=>{const q=B.MeshBuilder.CreateBox(n,o,scene);q.material=m;return q};
 let q=box('TSBD_6F_Floor',{width:roomW,height:.22,depth:roomD},mats.interiorFloor);q.position.set(x,floorY,z);
 q=box('TSBD_6F_Ceiling',{width:roomW,height:.18,depth:roomD},mats.interiorWall);q.position.set(x,floorY+wallH,z);
 q=box('TSBD_6F_BackWall',{width:roomW,height:wallH,depth:.22},mats.interiorWall);q.position.set(x,floorY+wallH/2,z+roomD/2);
 q=box('TSBD_6F_SideWall1',{width:.22,height:wallH,depth:roomD},mats.interiorWall);q.position.set(x-roomW/2,floorY+wallH/2,z);
 q=q.clone('TSBD_6F_SideWall2');q.position.x=x+roomW/2;
 const nwin=Math.max(4,Math.floor(roomW/5));
 for(let i=0;i<nwin;i++){const wx=x-roomW/2+2.6+i*(roomW-5.2)/Math.max(1,nwin-1);
  q=box('TSBD_WindowFrameL',{width:.13,height:2.3,depth:.18},mats.wood);q.position.set(wx-1.95,floorY+3.05,z-roomD/2+.12);
  q=q.clone('TSBD_WindowFrameR');q.position.x=wx+1.95;
  q=box('TSBD_WindowSill',{width:4.05,height:.12,depth:.35},mats.stone2);q.position.set(wx,floorY+1.98,z-roomD/2+.25);
  q=B.MeshBuilder.CreatePlane('TSBD_1963_Window',{width:3.85,height:2.05},scene);q.position.set(wx,floorY+3,z-roomD/2+.02);q.rotation.y=Math.PI;q.material=mats.glass;
 }
 for(let i=0;i<5;i++){const bx=x-roomW/2+3.5+i*(roomW-7)/4;
  q=box('TSBD_Column',{width:.42,height:wallH,depth:.42},mats.white);q.position.set(bx,floorY+wallH/2,z);q=box('TSBD_CeilingBeam',{width:.5,height:.34,depth:roomD},mats.white);q.position.set(bx,floorY+wallH-.28,z);
 }
 for(let row=0;row<3;row++)for(let col=0;col<7;col++){q=box('SchoolbookCarton',{width:1.25,height:1.05,depth:1.05},mats.cardboard);q.position.set(x-12+col*1.45,floorY+.62,z+7+row*1.25)}
 for(let row=0;row<2;row++){q=box('WarehouseShelf',{width:11,height:2.2,depth:.35},mats.wood);q.position.set(x+9,floorY+1.2,z+5+row*5)}
 for(let i=0;i<6;i++){const lx=x-roomW/2+3+i*(roomW-6)/5;q=B.MeshBuilder.CreateCylinder('LampCord',{diameter:.035,height:1,tessellation:8},scene);q.position.set(lx,floorY+wallH-.55,z-7);q.material=mats.iron;q=B.MeshBuilder.CreateSphere('WarehouseLamp',{diameter:.55,segments:12},scene);q.position.set(lx,floorY+wallH-1.05,z-7);q.scaling.y=.55;q.material=mats.metal;const l=new B.PointLight('LampLight',new B.Vector3(lx,floorY+wallH-1.1,z-7),scene);l.diffuse=new B.Color3(1,.78,.55);l.intensity=.15;l.range=9}
 const count=Math.max(5,Math.floor(roomW/4.3));
 for(let floor=0;floor<Math.max(4,Math.round((building.height||19.8)/3.2));floor++)for(let i=0;i<count;i++){const wx=x-roomW/2+2.2+i*(roomW-4.4)/Math.max(1,count-1);q=box('TSBD_ExteriorWindow',{width:2.55,height:1.55,depth:.12},mats.glass);q.position.set(wx,1.6+floor*3,minZ-.12);q=box('TSBD_StoneLintel',{width:2.9,height:.18,depth:.2},mats.stone2);q.position.set(wx,2.5+floor*3,minZ-.18)}
 q=box('TSBD_Cornice',{width:roomW+1,height:.55,depth:.65},mats.stone2);q.position.set(x,Math.min((building.height||19.8)-1,18.8),minZ-.1);
 return {x,z,floorY,roomW,roomD};
}
function addStreetUpgrade(){
 for(let i=-6;i<=6;i++){const q=B.MeshBuilder.CreateBox('RoadStripe',{width:3.4,height:.018,depth:.16},scene);q.position.set(i*6,.11,25);q.material=mats.white}
 for(const p of [[-48,18],[48,18],[-52,-12],[52,-12]]){let q=B.MeshBuilder.CreateCylinder('StreetLampPole',{diameter:.16,height:5.5,tessellation:10},scene);q.position.set(p[0],2.75,p[1]);q.material=mats.metal;q=B.MeshBuilder.CreateBox('StreetLampArm',{width:1.2,height:.12,depth:.12},scene);q.position.set(p[0]+.5,5.3,p[1]);q.material=mats.metal;q=B.MeshBuilder.CreateSphere('StreetLamp',{diameter:.3,segments:10},scene);q.position.set(p[0]+1,5.15,p[1]);q.material=mats.cream}
}
async function loadMeasured(){
 info.textContent='Loading 22 MB measured geometry…';
 const res=await fetch('https://www.wheretheylead.com/data/plaza-geometry.json',{cache:'force-cache'});
 if(!res.ok)throw new Error('Geometry download failed: '+res.status);
 const data=await res.json();
 const all=[];
 const cats=['buildings','roads','footways','grass','water','fences','walls'];
 for(const cat of cats){
  if(!Array.isArray(data[cat]))continue;
  for(const o of data[cat]){const ps=points(o);if(!ps)continue;const c=center(ps);if(Math.hypot(c.x,c.z)<310)all.push({cat,o,c})}
 }
 info.textContent='Building measured scene…';
 // Ground layers first.
 for(const e of all){
  const ps=points(e.o);if(e.cat==='grass')poly('MeasuredGrass',ps,.01,.025,mats.grass);
  else if(e.cat==='water')poly('MeasuredWater',ps,.035,.04,mats.water);
  else if(e.cat==='roads')poly('MeasuredRoad',ps,.02,.06,mats.street);
  else if(e.cat==='footways')poly('MeasuredFootway',ps,.075,.07,mats.sidewalk);
 }
 const buildings=(data.buildings||[]).filter(o=>{const ps=points(o),c=ps?center(ps):null;return c&&Math.hypot(c.x,c.z)<310});
 buildings.sort((a,b)=>Math.hypot(center(a).x,center(a).z)-Math.hypot(center(b).x,center(b).z));
 buildings.forEach((b,i)=>detailedBuilding(b,i));
 (data.trees||[]).forEach((t,i)=>{const ps=points(t),c=ps?center(ps):null;if(c&&Math.hypot(c.x,c.z)<310)treeAt([c.x,c.z],1+(i%3)*.12,i%2)});
 // Period details layered onto the measured layout.
 car(-14,14,.02,'red');car(12,18,Math.PI,'cream');car(4,5,-.1,'white');
 sign('DEALEY PLAZA',new B.Vector3(-11,2.8,-5));
 const named=buildings.find(b=>/depository|school book|book depository/i.test((b.name||'')));
 const six=buildings.filter(b=>Math.abs((b.height||0)-19.8)<2.5);
 const target=named||six.sort((u,v)=>Math.hypot(center(u).x,center(u).z)-Math.hypot(center(v).x,center(v).z))[0]||buildings[0];
 const room=addDepositoryUpgrade(target);addStreetUpgrade();
 if(room){camera.position.set(room.x,room.floorY+1.55,room.z+Math.min(8,room.roomD*.18));camera.setTarget(new B.Vector3(room.x,room.floorY+1.65,room.z-room.roomD*.35));}
 for(const m of scene.meshes)if(m.material && m.name!=='Explorer')try{m.receiveShadows=true;if(m.name.startsWith('MeasuredBuilding')||m.name.startsWith('Facade'))shadow.addShadowCaster(m,true)}catch(e){}
 for(const m of loadingWorld)m.dispose();info.textContent='Dealey Plaza · 1963 reconstruction · Texas School Book Depository 6th-floor interior';
}
loadMeasured().catch(e=>{console.error(e);info.textContent='Measured geometry could not load. Reload to retry.'});

const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let move={x:0,y:0},look={id:null,x:0,y:0};
function movePoint(e){move.x=B.Scalar.Clamp(e.clientX/innerWidth*2-1,-1,1);move.y=B.Scalar.Clamp(e.clientY/innerHeight*2-1,-1,1)}
canvas.addEventListener('pointerdown',e=>{if(e.clientX<innerWidth*.48){movePoint(e);canvas.setPointerCapture?.(e.pointerId)}else{look.id=e.pointerId;look.x=e.clientX;look.y=e.clientY;canvas.setPointerCapture?.(e.pointerId)}});
canvas.addEventListener('pointermove',e=>{if(e.pointerId===look.id){const dx=e.clientX-look.x,dy=e.clientY-look.y;camera.rotation.y+=dx*.0031;camera.rotation.x+=dy*.0022;camera.rotation.x=B.Scalar.Clamp(camera.rotation.x,-1.25,1.25);look.x=e.clientX;look.y=e.clientY}else if(e.clientX<innerWidth*.48)movePoint(e)});
['pointerup','pointercancel'].forEach(ev=>canvas.addEventListener(ev,e=>{if(e.pointerId===look.id)look.id=null;move.x=move.y=0}));

function applyQuality(v){const s={Cinematic:[.85,true,.0012],High:[1.0,true,.0018],Balanced:[1.12,false,.0022],Performance:[1.28,false,.0028]}[v];engine.setHardwareScalingLevel(s[0]);pipe.bloomEnabled=s[1];scene.fogDensity=s[2];shadow.mapSize=v==='Cinematic'?2048:1536}
quality.onchange=()=>applyQuality(quality.value);applyQuality('High');

let frames=0;scene.onBeforeRenderObservable.add(()=>{const f=keys.w||keys.arrowup?-1:keys.s||keys.arrowdown?1:move.y;const str=keys.d||keys.arrowright?1:keys.a||keys.arrowleft?-1:move.x;const sp=keys.shift?camera.speed*1.7:camera.speed;let fw=camera.getDirection(B.Axis.Z);fw.y=0;fw.normalize();let rt=camera.getDirection(B.Axis.X);rt.y=0;rt.normalize();camera.position.addInPlace(fw.scale(-f*sp));camera.position.addInPlace(rt.scale(str*sp));camera.position.y=Math.max(1.6,camera.position.y);if(++frames%30===0)info.textContent='Dealey Plaza · 1963  |  '+Math.round(engine.getFps())+' FPS'});
engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>engine.resize());
})();
</script>
