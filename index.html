<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Dealey Plaza 1963</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#6e757a;font-family:system-ui;color:#fff}#game{width:100%;height:100%;display:block;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between}.card{background:#080b0ccc;border:1px solid #ffffff24;border-radius:12px;padding:9px 12px;font-size:12px;backdrop-filter:blur(8px)}.title{font-weight:800;font-size:14px}.sub{opacity:.65}.bottom{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);white-space:nowrap}.cross{position:absolute;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%);opacity:.45}.cross:before,.cross:after{content:'';position:absolute;background:#fff}.cross:before{width:16px;height:1px;top:8px}.cross:after{height:16px;width:1px;left:8px}select{background:#111;color:#fff;border:1px solid #666;border-radius:7px;padding:5px}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="top"><div class="card"><div class="title">DEALEY PLAZA · 1963</div><div class="sub">Historical reconstruction / exploration</div></div><div class="card">Quality <select id="q"><option>Cinematic</option><option selected>High</option><option>Balanced</option><option>Performance</option></select></div></div><div class="cross"></div><div id="info" class="card bottom">Initializing Dallas scene…</div></div><script src="https://cdn.babylonjs.com/babylon.js"></script><script>(()=>{const B=window.BABYLON,C=document.getElementById('game'),I=document.getElementById('info'),Q=document.getElementById('q');if(!B){I.textContent='Renderer unavailable';return}const E=new B.Engine(C,true,{antialias:true,stencil:true});const S=new B.Scene(E);S.clearColor=new B.Color4(.43,.48,.52,1);S.fogMode=B.Scene.FOGMODE_EXP2;S.fogColor=new B.Color3(.43,.48,.52);S.fogDensity=.0007;const CAM=new B.UniversalCamera('Explorer',new B.Vector3(0,3.2,-55),S);CAM.speed=.22;CAM.minZ=.05;CAM.maxZ=1800;CAM.setTarget(new B.Vector3(0,4,0));CAM.attachControl(C,true);const H=new B.HemisphericLight('Sky',new B.Vector3(0,1,0),S);H.intensity=.82;H.groundColor=new B.Color3(.18,.18,.16);const SUN=new B.DirectionalLight('Sun',new B.Vector3(-.45,-1,.3),S);SUN.position=new B.Vector3(180,240,130);SUN.intensity=2.15;const P=new B.DefaultRenderingPipeline('Post',true,S,[CAM]);P.fxaaEnabled=true;P.imageProcessingEnabled=true;P.imageProcessing.exposure=1.02;P.imageProcessing.contrast=1.1;P.bloomEnabled=true;P.bloomThreshold=.96;P.bloomWeight=.035;P.bloomKernel=24;const M={};function mat(n,c,r=.8,metal=0){let m=new B.PBRMaterial(n,S);m.albedoColor=B.Color3.FromHexString(c);m.roughness=r;m.metallic=metal;m.environmentIntensity=.25;M[n]=m;return m}mat('road','#26292a',.96);mat('concrete','#aaa79c',.9);mat('limestone','#b9ad98',.82);mat('stone','#777066',.95);mat('brick','#713f2e',.94);mat('glass','#14262c',.15,.15);mat('metal','#242627',.38,.72);mat('wood','#674b34',.9);mat('grass','#526447',1);mat('grass2','#69765a',1);mat('white','#ddd7c8',.72);mat('cream','#c5b394',.58);mat('red','#74211b',.4,.05);mat('blue','#344c5a',.48,.05);mat('card','#9b7042',.98);mat('roof','#4c4943',.98);function box(n,w,h,d,x,y,z,m){let o=B.MeshBuilder.CreateBox(n,{width:w,height:h,depth:d},S);o.position.set(x,y,z);o.material=m;return o}function cyl(n,d,h,x,y,z,m,t=16){let o=B.MeshBuilder.CreateCylinder(n,{diameter:d,height:h,tessellation:t},S);o.position.set(x,y,z);o.material=m;return o}function planeText(txt,w,h,x,y,z,rot=0){let p=B.MeshBuilder.CreatePlane('HistoricalText',{width:w,height:h},S);p.position.set(x,y,z);p.rotation.y=rot;let t=new B.DynamicTexture('text',{width:1200,height:300},S,true);t.drawText(txt,null,195,'bold 90px Arial','#eee8d8','transparent',true);let m=new B.StandardMaterial('textmat',S);m.diffuseTexture=t;m.emissiveColor=new B.Color3(.08,.08,.07);p.material=m;return p}function sedan(x,z,r,c){let root=new B.TransformNode('1963 sedan',S);root.position.set(x,.5,z);root.rotation.y=r;box('body',5,1.05,2,0,.55,0,M[c]).parent=root;box('hood',1.6,.45,1.8,1.5,1.15,0,M[c]).parent=root;box('cabin',2.55,1.05,1.7,-.45,1.48,0,M[c]).parent=root;box('glass',2.2,.6,1.72,-.45,1.53,0,M.glass).parent=root;for(let a of[-1.75,1.75])for(let b of[-.82,.82]){let w=cyl('wheel',.9,.28,a,.08,b,M.metal,18);w.rotation.z=Math.PI/2;w.parent=root}}function tree(x,z,k=1){cyl('oak trunk',.55*k,4.3*k,x,2.15*k,z,M.wood,10);for(let i=0;i<7;i++){let a=i*Math.PI*2/7,f=B.MeshBuilder.CreateSphere('oak crown',{diameter:3.5*k,segments:10},S);f.position.set(x+Math.cos(a)*1.3*k,4.55*k,z+Math.sin(a)*1.3*k);f.material=i%2?M.grass2:M.grass}}function lamp(x,z){cyl('lamp pole',.18,4.8,x,2.4,z,M.metal,12);box('lamp arm',1,.12,.12,x+.42,4.62,z,M.metal);cyl('lamp head',.38,.22,x+.9,4.48,z,M.cream,14)}function pergola(x,z){box('pergola roof',18,.5,3,x,5,z,M.concrete);for(let i=-8;i<=8;i+=4)box('pergola column',.55,5,.55,x+i,2.5,z,M.concrete);box('pergola wall',18,2.8,.5,x,1.4,z+1.1,M.concrete);box('pergola bench',12,.42,1,x,1,z-1.2,M.stone)}function fence(x,z,len,r){let root=new B.TransformNode('picket fence',S);root.position.set(x,.8,z);root.rotation.y=r;for(let i=0;i<=Math.floor(len/1.8);i++)box('picket',.12,1.6,.1,-len/2+i*1.8,0,0,M.wood).parent=root;box('rail',len,.12,.12,0,.55,0,M.wood).parent=root;box('rail',len,.12,.12,0,1.05,0,M.wood).parent=root}function tsbd(x,z,w,d,h){let root=new B.TransformNode('TSBD 1963',S);root.position.set(x,0,z);for(let f=0;f<7;f++){let y=1.65+f*2.65;for(let i=0;i<11;i++){let xx=-w/2+2.2+i*(w-4.4)/10;let win=box('TSBD window',2.05,1.72,.12,xx,y,-d/2-.1,M.glass);win.parent=root;let l=box('window frame',.1,1.9,.18,xx-1.03,y,-d/2-.2,M.cream);l.parent=root;let rr=l.clone('window frame R');rr.position.x=xx+1.03;rr.parent=root;if(f===0)for(let k=0;k<3;k++){let br=box('breeze block',2.15,.52,.22,xx,.48+k*.6,-d/2-.22,M.stone);br.parent=root}}}let roof=box('TSBD roof',w+1,.55,d+1,0,h-.18,0,M.roof);roof.parent=root;let sign=planeText('TEXAS SCHOOL BOOK DEPOSITORY',w*.72,1.2,0,h+1.05,-d/2-.25,0);sign.parent=root;box('main entrance',6,2.7,.3,0,1.35,-d/2-.25,M.stone).parent=root;for(let i=-2;i<=2;i++)box('entry column',.3,2.8,.5,i*1.35,1.4,-d/2-.5,M.concrete).parent=root;return root}function measuredPoly(ps,h,m){let sh=ps.map(p=>new B.Vector3(p[0],p[1],0));try{let x=new B.PolygonMeshBuilder('measured building',sh,S).build(false,h);x.rotation.x=-Math.PI/2;x.material=m;x.receiveShadows=true;return x}catch(e){return null}}function center(p){let x=0,z=0;for(let v of p){x+=v[0];z+=v[1]}return[x/p.length,z/p.length]}async function load(){try{I.textContent='Loading measured city geometry…';let r=await fetch('https://www.wheretheylead.com/data/plaza-geometry.json',{cache:'force-cache'});let d=await r.json();let bs=(d.buildings||[]).filter(b=>{let p=b.outer||b.polygon;if(!p)return false;let c=center(p);return Math.hypot(c[0],c[1])<310});for(let b of bs){let p=b.outer||b.polygon;measuredPoly(p,Math.max(2,Math.min(90,b.height||8)),M.limestone)}let cand=bs.filter(b=>Math.abs((b.height||0)-19.9)<1.5);let target=cand.sort((a,b)=>Math.hypot(...center(a.outer||a.polygon))-Math.hypot(...center(b.outer||b.polygon)))[0]||bs[0];let p=target.outer||target.polygon,c=center(p),w=Math.max(30,Math.min(55,Math.max(...p.map(v=>v[0]))-Math.min(...p.map(v=>v[0])))),dpth=Math.max(30,Math.min(55,Math.max(...p.map(v=>v[1]))-Math.min(...p.map(v=>v[1]))));tsbd(c[0],c[1],w,dpth,target.height||20);let px=c[0]-35,pz=c[1]+60;box('plaza surface',125,.12,105,px,.05,pz,M.concrete);for(let p2 of[[-42,-4],[-31,8],[-18,16],[25,12],[39,1]])tree(px+p2[0],pz+p2[1],1.15);for(let p2 of[[-45,-18],[-28,-28],[30,-22],[48,-5]])lamp(px+p2[0],pz+p2[1]);pergola(px-28,pz+20);fence(px-20,pz+25,42,.12);sedan(px-24,pz-22,.02,'cream');sedan(px-4,pz-17,Math.PI,'red');sedan(px+18,pz-28,.02,'blue');sedan(px+38,pz-10,-.4,'white');CAM.position.set(px,pz*0+3.2,pz+38);CAM.setTarget(new B.Vector3(px,pz,0));I.textContent='DEALEY PLAZA · 1963 | Historical exploration'}catch(err){console.error(err);I.textContent='Measured data unavailable — local scene active'}}load();const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);let mv={x:0,y:0},look=null;C.addEventListener('pointerdown',e=>{if(e.clientX<innerWidth*.48){mv.x=e.clientX/innerWidth*2-1;mv.y=e.clientY/innerHeight*2-1}else look={id:e.pointerId,x:e.clientX,y:e.clientY};C.setPointerCapture?.(e.pointerId)});C.addEventListener('pointermove',e=>{if(look&&e.pointerId===look.id){CAM.rotation.y+=(e.clientX-look.x)*.003;CAM.rotation.x=B.Scalar.Clamp(CAM.rotation.x+(e.clientY-look.y)*.002,-1.2,1.2);look.x=e.clientX;look.y=e.clientY}else if(e.clientX<innerWidth*.48){mv.x=e.clientX/innerWidth*2-1;mv.y=e.clientY/innerHeight*2-1}});['pointerup','pointercancel'].forEach(v=>C.addEventListener(v,e=>{if(look&&e.pointerId===look.id)look=null;mv.x=mv.y=0}));function setQ(v){let a={Cinematic:[.8,true],High:[1,true],Balanced:[1.15,false],Performance:[1.35,false]}[v];E.setHardwareScalingLevel(a[0]);P.bloomEnabled=a[1]}Q.onchange=()=>setQ(Q.value);setQ('High');let fr=0;S.onBeforeRenderObservable.add(()=>{let f=keys.w||keys.arrowup?-1:keys.s||keys.arrowdown?1:mv.y,st=keys.d||keys.arrowright?1:keys.a||keys.arrowleft?-1:mv.x,fw=CAM.getDirection(B.Axis.Z),rt=CAM.getDirection(B.Axis.X);fw.y=0;rt.y=0;fw.normalize();rt.normalize();CAM.position.addInPlace(fw.scale(-f*CAM.speed));CAM.position.addInPlace(rt.scale(st*CAM.speed));CAM.position.y=Math.max(1.55,CAM.position.y);if(++fr%90===0)I.textContent='DEALEY PLAZA · 1963 | '+Math.round(E.getFps())+' FPS'});E.runRenderLoop(()=>S.render());addEventListener('resize',()=>E.resize())})();</script></body></html>
