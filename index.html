<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#17232b"><title>Dealey Plaza 1963 — Explorer</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18252b;color:#f5f0e5;font:14px system-ui}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none}.panel{background:#101820df;border:1px solid #ffffff28;border-radius:12px;padding:10px 13px;backdrop-filter:blur(8px);box-shadow:0 5px 24px #0005}.head{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;align-items:start}.name{font-weight:900;letter-spacing:.1em;font-size:12px}.small{font-size:10px;color:#c0cbcd;margin-top:3px}.hint{position:absolute;top:76px;left:10px;max-width:205px;font-size:11px;line-height:1.5}.bottom{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);text-align:center;max-width:90vw;white-space:normal}.controls{position:fixed;inset:auto 0 0;height:160px;pointer-events:none}.pad{position:absolute;bottom:17px;left:17px;width:126px;height:126px;border-radius:50%;background:#0c141a99;border:1px solid #ffffff55;pointer-events:auto;touch-action:none}.nub{position:absolute;left:40px;top:40px;width:44px;height:44px;border-radius:50%;background:#e9e4d3d9;border:1px solid white;box-shadow:0 2px 12px #0008}.look{position:absolute;right:0;bottom:0;width:55%;height:180px;pointer-events:auto;touch-action:none}.btn{pointer-events:auto;background:#263943;color:white;border:1px solid #ffffff44;border-radius:8px;padding:7px 9px;font-weight:700;font-size:11px}#menu{position:absolute;right:10px;top:76px;display:flex;gap:6px;pointer-events:auto}#map{position:absolute;right:10px;top:124px;width:112px;height:88px;border:1px solid #ffffff55;border-radius:9px;background:#101820d9}#overlay{position:fixed;inset:0;display:none;place-items:center;background:#101820cc;padding:20px;text-align:center;pointer-events:auto}#overlay .panel{max-width:320px}
</style></head><body><canvas id="game"></canvas><div id="hud"><div class="head"><div class="panel"><div class="name">DEALEY PLAZA <span style="color:#c5a978">· 1963</span></div><div class="small">HISTORICAL WALKING EXPLORER</div></div><div class="panel"><div id="status">Preparing plaza…</div><div class="small" id="fps">Touch to explore</div></div></div><div class="panel hint"><b>EXPLORE</b><br>Left stick: move · right side: rotate view<br>Tap a landmark to inspect it.<br><span style="color:#d5bd8f">Walk toward the gold marker.</span></div><div id="menu"><button class="btn" id="reset">RESTART</button><button class="btn" id="quality">PERFORMANCE</button></div><canvas id="map" width="224" height="176"></canvas><div class="panel bottom" id="caption">Find the Texas School Book Depository</div></div><div class="controls"><div class="pad" id="pad"><div class="nub" id="nub"></div></div><div class="look" id="look"></div></div><div id="overlay"><div class="panel"><h2>Explorer paused</h2><p>Tap resume to continue walking through the plaza.</p><button class="btn" id="resume">RESUME</button></div></div>
<script>(()=>{'use strict';const c=document.querySelector('#game'),ctx=c.getContext('2d'),map=document.querySelector('#map'),m=map.getContext('2d'),status=document.querySelector('#status'),caption=document.querySelector('#caption');let W,H,D=1,perf=true,paused=false,last=0,frames=0,ft=0;const world={w:1900,h:1450};let p={x:940,y:1190,dir:-Math.PI/2},stick={x:0,y:0},keys={},look=null;const places=[{name:'Texas School Book Depository',x:840,y:405,w:330,h:215,color:'#b6a58a',floors:6,kind:'building',desc:'The former Texas School Book Depository stands beside Elm Street. Explore the exterior and surrounding streets.'},{name:'County Records Building',x:1330,y:355,w:255,h:190,color:'#b8b4a9',floors:7,kind:'building',desc:'A large civic building bordering the plaza.'},{name:'Pergola & monument',x:395,y:660,w:240,h:105,kind:'pergola',desc:'The pergola and monument sit on the grassy knoll.'},{name:'Grassy knoll',x:480,y:805,w:340,h:240,kind:'hill',desc:'A raised, landscaped area overlooking the plaza.'},{name:'Triple Underpass',x:670,y:135,w:710,h:145,kind:'bridge',desc:'The railroad triple underpass forms the northern edge of Dealey Plaza.'},{name:'Elm Street',x:0,y:900,w:1900,h:190,kind:'road',desc:'Elm Street runs past the south side of the plaza.'}];let trees=[];for(let i=0;i<130;i++){let x=100+(i*197)%1700,y=300+(i*271)%1020;if(!(x>760&&x<1250&&y>340&&y<690)&&!(x>370&&x<850&&y>650&&y<1080))trees.push({x,y,r:10+(i%6)*2.5,shade:i%3})}let cars=[];for(let i=0;i<27;i++)cars.push({x:180+(i*173)%1530,y:925+(i%5)*35,a:(i%4-1.5)*.025,col:['#c8c1ae','#7d3930','#354b58','#d6d0c4','#646b60'][i%5]});function resize(){D=Math.min(devicePixelRatio||1,perf?1.35:1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);function rr(x,y,w,h,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function drawBuilding(l){ctx.fillStyle='#777268';ctx.fillRect(l.x+13,l.y+18,l.w,l.floors*23);ctx.fillStyle=l.color;ctx.fillRect(l.x,l.y,l.w,l.floors*23);ctx.fillStyle='#d5c9b3';ctx.fillRect(l.x-8,l.y-10,l.w+16,13);for(let f=0;f<l.floors;f++){ctx.fillStyle=f===0?'#a89b85':'#39494d';for(let x=l.x+13;x<l.x+l.w-10;x+=27){ctx.fillRect(x,l.y+f*23+7,17,11);ctx.strokeStyle='#d8cbb4';ctx.lineWidth=2;ctx.strokeRect(x-2,l.y+f*23+5,21,15)}ctx.fillStyle='#8c806d';ctx.fillRect(l.x,l.y+f*23+21,l.w,2)}ctx.fillStyle='#594d40';ctx.fillRect(l.x,l.y+l.floors*23-19,l.w,19);if(l.name.includes('Depository')){ctx.fillStyle='#e8dfcd';ctx.fillRect(l.x+34,l.y+l.floors*23-43,l.w-68,19);ctx.fillStyle='#51483d';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('TEXAS SCHOOL BOOK DEPOSITORY',l.x+l.w/2,l.y+l.floors*23-29)}}function draw(){ctx.fillStyle='#aeb8b0';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2-p.x,H/2-p.y);ctx.fillStyle='#9da89a';ctx.fillRect(0,0,world.w,world.h);
// streets, curbs and sidewalks
ctx.fillStyle='#41494b';ctx.fillRect(0,860,world.w,280);ctx.fillRect(0,140,world.w,150);ctx.fillRect(650,0,180,world.h);ctx.fillRect(1190,0,160,world.h);ctx.fillStyle='#c4beb0';ctx.fillRect(0,842,world.w,17);ctx.fillRect(0,1140,world.w,16);ctx.fillRect(0,290,world.w,16);ctx.fillStyle='#d5cfc0';for(let x=0;x<world.w;x+=92){ctx.fillRect(x,986,48,5);ctx.fillRect(x,858,48,4)}
// plaza paving and landscaped areas
ctx.fillStyle='#c0bbae';ctx.fillRect(170,300,1480,510);ctx.fillStyle='#a6ad9c';ctx.fillRect(205,330,1410,450);ctx.strokeStyle='#d4cdbf';ctx.lineWidth=5;for(let x=250;x<1600;x+=100){ctx.beginPath();ctx.moveTo(x,330);ctx.lineTo(x,780);ctx.stroke()}for(let y=370;y<780;y+=82){ctx.beginPath();ctx.moveTo(205,y);ctx.lineTo(1615,y);ctx.stroke()}
// underpass with deep shadow and arches
ctx.fillStyle='#77776f';ctx.fillRect(660,130,730,160);ctx.fillStyle='#252d30';for(let x=685;x<1370;x+=112){ctx.beginPath();ctx.moveTo(x,278);ctx.lineTo(x,205);ctx.quadraticCurveTo(x+45,130,x+90,205);ctx.lineTo(x+90,278);ctx.closePath();ctx.fill()}ctx.fillStyle='#b0a99b';ctx.fillRect(650,126,750,13);ctx.fillStyle='#88877e';ctx.fillRect(650,283,750,8);
// hill, paths and pergola base
ctx.fillStyle='#899a78';ctx.beginPath();ctx.ellipse(620,825,340,215,-.18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#718666';ctx.beginPath();ctx.ellipse(540,790,250,150,-.18,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d5cdbb';ctx.lineWidth=28;ctx.beginPath();ctx.moveTo(450,1000);ctx.lineTo(620,830);ctx.lineTo(850,770);ctx.stroke();ctx.beginPath();ctx.moveTo(540,690);ctx.lineTo(540,1030);ctx.stroke();
for(const l of places){if(l.kind==='building')drawBuilding(l);if(l.kind==='pergola'){ctx.fillStyle='#c8c0ad';ctx.fillRect(l.x,l.y,l.w,74);ctx.fillStyle='#8f8777';for(let x=l.x+12;x<l.x+l.w;x+=38)ctx.fillRect(x,l.y-4,10,87);ctx.fillStyle='#e0d6c1';ctx.fillRect(l.x-8,l.y-10,l.w+16,13);ctx.fillStyle='#6e6659';ctx.fillRect(l.x+30,l.y+30,l.w-60,7)}}
// trees with layered foliage
for(const t of trees){ctx.fillStyle='#5a4b3b';ctx.fillRect(t.x-3,t.y,6,18);ctx.fillStyle=['#4e694e','#587253','#63795a'][t.shade];ctx.beginPath();ctx.arc(t.x,t.y-3,t.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#80916c';ctx.beginPath();ctx.arc(t.x-t.r*.22,t.y-t.r*.28,t.r*.57,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffffff12';ctx.beginPath();ctx.arc(t.x-t.r*.25,t.y-t.r*.3,t.r*.25,0,Math.PI*2);ctx.fill()}
// street lamps
for(let x=230;x<1700;x+=155){ctx.fillStyle='#303431';ctx.fillRect(x,585,4,61);ctx.fillRect(x-8,579,21,7);ctx.fillStyle='#d6c49a';ctx.fillRect(x-4,578,12,3)}
// era-style cars
for(const a of cars){ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.a);ctx.fillStyle='#202424';ctx.fillRect(-24,-13,49,29);ctx.fillStyle=a.col;ctx.fillRect(-25,-15,50,26);ctx.fillStyle='#2b4148';ctx.fillRect(-11,-12,23,20);ctx.fillStyle='#ded7c5';ctx.fillRect(18,-10,4,5);ctx.fillRect(18,5,4,5);ctx.restore()}
// destination marker and player
let target=places[0],tx=target.x+target.w/2,ty=target.y+target.floors*11+28;ctx.strokeStyle='#d7b56e';ctx.lineWidth=3;ctx.beginPath();ctx.arc(tx,ty,22+Math.sin(performance.now()/240)*4,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#d7b56e';ctx.beginPath();ctx.arc(tx,ty,5,0,Math.PI*2);ctx.fill();ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.dir);ctx.fillStyle='#17242a';ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f3e6c9';ctx.beginPath();ctx.moveTo(19,0);ctx.lineTo(-8,-8);ctx.lineTo(-8,8);ctx.closePath();ctx.fill();ctx.restore();ctx.restore();let grad=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.75);grad.addColorStop(0,'#0000');grad.addColorStop(1,'#17212655');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);drawMap()}
function drawMap(){m.fillStyle='#17232a';m.fillRect(0,0,224,176);m.fillStyle='#89958a';m.fillRect(8,8,208,160);m.fillStyle='#434b4c';m.fillRect(8,104,208,32);m.fillRect(8,17,208,20);m.fillRect(80,8,22,160);m.fillRect(139,8,20,160);m.fillStyle='#c2b9a7';m.fillRect(23,44,174,57);m.fillStyle='#b6a58a';m.fillRect(100,47,39,28);m.fillStyle='#77876b';m.beginPath();m.ellipse(71,100,38,25,-.2,0,Math.PI*2);m.fill();m.fillStyle='#d7b56e';m.beginPath();m.arc(100+(p.x-940)/10,47+(p.y-405)/10,4,0,Math.PI*2);m.fill();m.strokeStyle='#ffffff80';m.strokeRect(8,8,208,160)}
function tick(now){if(!paused){let dt=Math.min((now-last)/16.67,2.2);last=now;let forward=stick.y+(keys.w||keys.arrowup? -1:0)-(keys.s||keys.arrowdown? -1:0),side=stick.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);let mag=Math.hypot(forward,side);if(mag>1){forward/=mag;side/=mag}if(mag>.035){let speed=3.2*dt,fx=Math.cos(p.dir),fy=Math.sin(p.dir);p.x=Math.max(35,Math.min(world.w-35,p.x+(fx*forward-fy*side)*speed));p.y=Math.max(35,Math.min(world.h-35,p.y+(fy*forward+fx*side)*speed));}draw();frames++;if(now-ft>1000){document.querySelector('#fps').textContent=Math.round(frames*1000/(now-ft))+' FPS · '+(perf?'Balanced':'Low power');frames=0;ft=now}}requestAnimationFrame(tick)}
const pad=document.querySelector('#pad'),nub=document.querySelector('#nub');let padId=null;function moveStick(e){let r=pad.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,mag=Math.min(43,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);stick.x=Math.cos(a)*mag/43;stick.y=Math.sin(a)*mag/43;nub.style.transform=`translate(${stick.x*38}px,${stick.y*38}px)`}pad.addEventListener('pointerdown',e=>{padId=e.pointerId;pad.setPointerCapture(e.pointerId);moveStick(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===padId)moveStick(e)});function endPad(e){if(e.pointerId===padId){padId=null;stick.x=stick.y=0;nub.style.transform=''}}pad.addEventListener('pointerup',endPad);pad.addEventListener('pointercancel',endPad);const lookEl=document.querySelector('#look');lookEl.addEventListener('pointerdown',e=>{look={id:e.pointerId,x:e.clientX};lookEl.setPointerCapture(e.pointerId)});lookEl.addEventListener('pointermove',e=>{if(look&&look.id===e.pointerId){p.dir+=(e.clientX-look.x)*.008;look.x=e.clientX}});['pointerup','pointercancel'].forEach(t=>lookEl.addEventListener(t,e=>{if(look&&look.id===e.pointerId)look=null}));addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==='Escape'){paused=!paused;document.querySelector('#overlay').style.display=paused?'grid':'none'}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);document.querySelector('#reset').onclick=()=>{p={x:940,y:1190,dir:-Math.PI/2};caption.textContent='Restarted — head north toward the plaza'};document.querySelector('#quality').onclick=()=>{perf=!perf;document.querySelector('#quality').textContent=perf?'PERFORMANCE':'BALANCED';resize()};document.querySelector('#resume').onclick=()=>{paused=false;document.querySelector('#overlay').style.display='none';last=performance.now();requestAnimationFrame(tick)};c.addEventListener('pointerup',e=>{if(e.clientX<W*.45&&e.clientY>H*.5)return;let wx=p.x+e.clientX-W/2,wy=p.y+e.clientY-H/2,near=places.map(l=>({l,d:Math.hypot(wx-l.x-l.w/2,wy-l.y-(l.floors?l.floors*11:35))})).sort((a,b)=>a.d-b.d)[0];if(near&&near.d<250)caption.textContent=near.l.name+' — '+near.l.desc});resize();status.textContent='Plaza loaded';caption.textContent='Find the Texas School Book Depository';requestAnimationFrame(tick)})();</script></body></html>
