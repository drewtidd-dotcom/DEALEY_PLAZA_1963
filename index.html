<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#17232b"><title>Dealey Plaza 1963 — Explorer</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18252b;color:#fff;font:14px system-ui}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none}.panel{background:#101820df;border:1px solid #ffffff25;border-radius:12px;padding:10px 13px;backdrop-filter:blur(8px);box-shadow:0 5px 24px #0005}.head{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;align-items:start}.name{font-weight:850;letter-spacing:.08em}.small{font-size:11px;color:#b9c5c9;margin-top:3px}.bottom{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}.hint{position:absolute;top:80px;left:10px;max-width:230px;font-size:11px;color:#d9e1e4}.controls{position:fixed;inset:auto 0 0;height:155px;pointer-events:none}.pad{position:absolute;bottom:18px;left:18px;width:124px;height:124px;border-radius:50%;background:#0c141a88;border:1px solid #ffffff45;pointer-events:auto;touch-action:none}.nub{position:absolute;left:39px;top:39px;width:44px;height:44px;border-radius:50%;background:#e9e4d3bb;border:1px solid white;box-shadow:0 2px 12px #0008}.look{position:absolute;right:0;bottom:0;width:55%;height:180px;pointer-events:auto;touch-action:none}.btn{pointer-events:auto;background:#263943;color:white;border:1px solid #ffffff44;border-radius:8px;padding:7px 9px;font-weight:700}#menu{position:absolute;right:10px;top:80px;display:flex;gap:6px;pointer-events:auto}#overlay{position:fixed;inset:0;display:none;place-items:center;background:#101820cc;padding:20px;text-align:center}#overlay .panel{max-width:320px}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="head"><div class="panel"><div class="name">DEALEY PLAZA · 1963</div><div class="small">Historical environment explorer</div></div><div class="panel"><div id="status">Loading world…</div><div class="small" id="fps">Mobile build</div></div></div><div class="panel hint">Explore the plaza<br>Left pad: walk · drag right side: look<br>Tap landmarks to inspect</div><div id="menu"><button class="btn" id="reset">Reset</button><button class="btn" id="quality">Quality: High</button></div><div class="panel bottom" id="caption">Preparing Dealey Plaza</div></div><div class="controls"><div class="pad" id="pad"><div class="nub" id="nub"></div></div><div class="look" id="look"></div></div><div id="overlay"><div class="panel"><h2>World paused</h2><p id="err">The explorer is still available.</p><button class="btn" id="resume">Resume</button></div></div><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d',{alpha:false}),status=document.getElementById('status'),caption=document.getElementById('caption'),fps=document.getElementById('fps');let W=0,H=0,dpr=1,quality=1,paused=false;const world={w:1800,h:1400};let player={x:900,y:1030,dir:-Math.PI/2};let keys={},stick={x:0,y:0},look=null,last=performance.now(),frames=0,fpsT=0;const landmarks=[{name:'Texas School Book Depository',x:870,y:410,w:310,h:205,type:'building',color:'#a99a7e',h:7},{name:'County Records Building',x:1290,y:350,w:245,h:190,type:'building',color:'#b7b1a5',h:8},{name:'Pergola & monument',x:440,y:620,w:205,h:100,type:'pergola'},{name:'Grassy knoll',x:510,y:780,w:310,h:230,type:'hill'},{name:'Triple Underpass',x:900,y:180,w:560,h:110,type:'bridge'}];const trees=[];for(let i=0;i<78;i++){let x=230+((i*173)%1360),y=260+((i*239)%920);if(!(x>730&&x<1200&&y>350&&y<650)&&!(x>700&&x<1100&&y>850&&y<1120))trees.push({x,y,r:13+(i%5)*3})}const cars=[];for(let i=0;i<17;i++)cars.push({x:300+(i*191)%1220,y:900+(i%4)*43,dir:(i%3-1)*.04,color:['#c9c2ae','#6d3028','#344b59','#d5d0c4'][i%4]});function resize(){dpr=Math.min(devicePixelRatio||1,quality===0.65?1:1.5);W=innerWidth;H=innerHeight;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);function rounded(x,y,w,h,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function worldToScreen(x,y){return{x:W/2+(x-player.x),y:H/2+(y-player.y)}}function draw(){ctx.fillStyle='#aab5b4';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2-player.x,H/2-player.y);
// city ground and broad period roads
ctx.fillStyle='#9da69d';ctx.fillRect(0,0,world.w,world.h);ctx.fillStyle='#424849';ctx.fillRect(0,830,world.w,250);ctx.fillRect(0,140,world.w,125);ctx.fillRect(650,0,190,world.h);ctx.fillRect(1120,0,155,world.h);ctx.fillStyle='#c2bdb0';for(let x=0;x<world.w;x+=80){ctx.fillRect(x,824,42,5);ctx.fillRect(x,1077,42,5)}
// sidewalks/plaza
ctx.fillStyle='#b9b5a8';ctx.fillRect(170,300,1470,500);ctx.fillStyle='#8d9a7d';ctx.beginPath();ctx.ellipse(600,770,310,185,-.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#718366';ctx.beginPath();ctx.ellipse(530,755,230,125,-.2,0,Math.PI*2);ctx.fill();
// underpass piers and dark openings
ctx.fillStyle='#6d6a62';ctx.fillRect(660,125,620,155);ctx.fillStyle='#252c2e';for(let x=690;x<1260;x+=95){ctx.fillRect(x,155,60,100)}ctx.fillStyle='#aaa394';ctx.fillRect(650,125,640,18);
// plaza paths
ctx.strokeStyle='#d4cfc1';ctx.lineWidth=30;ctx.beginPath();ctx.moveTo(430,790);ctx.lineTo(830,650);ctx.lineTo(1060,790);ctx.stroke();ctx.beginPath();ctx.moveTo(580,600);ctx.lineTo(580,850);ctx.stroke();
// landmarks behind details
for(const l of landmarks){if(l.type==='building'){ctx.fillStyle='#716a5e';ctx.fillRect(l.x+10,l.y+12,l.w,l.h*17);ctx.fillStyle=l.color;ctx.fillRect(l.x,l.y,l.w,l.h*17);ctx.fillStyle='#c8bca5';ctx.fillRect(l.x-8,l.y-12,l.w+16,14);for(let f=0;f<l.h;f++){for(let x=l.x+13;x<l.x+l.w-8;x+=27){ctx.fillStyle=f<2?'#d0c8b6':'#39474b';ctx.fillRect(x,l.y+f*17+8,17,10);ctx.strokeStyle='#d7c9ad';ctx.strokeRect(x-2,l.y+f*17+6,21,14)}}ctx.fillStyle='#574d40';ctx.fillRect(l.x,l.y+l.h*17-18,l.w,18);if(l.name.includes('Depository')){ctx.fillStyle='#e5dcc8';ctx.fillRect(l.x+35,l.y+l.h*17-43,l.w-70,20);ctx.fillStyle='#51483d';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('TEXAS SCHOOL BOOK DEPOSITORY',l.x+l.w/2,l.y+l.h*17-29)}}else if(l.type==='pergola'){ctx.fillStyle='#d0c7b4';ctx.fillRect(l.x,l.y,l.w,70);ctx.fillStyle='#918876';for(let x=l.x+12;x<l.x+l.w;x+=38)ctx.fillRect(x,l.y,10,80);ctx.fillRect(l.x-8,l.y-8,l.w+16,12)}else if(l.type==='bridge'){ctx.fillStyle='#777970';ctx.fillRect(l.x,l.y,l.w,l.h);ctx.fillStyle='#a9a79d';ctx.fillRect(l.x,l.y,l.w,14);for(let x=l.x+20;x<l.x+l.w;x+=85){ctx.fillStyle='#4a4e4c';ctx.fillRect(x,l.y+18,48,l.h-20)}}}
// trees
for(const t of trees){ctx.fillStyle='#5a4938';ctx.fillRect(t.x-3,t.y,6,19);ctx.fillStyle='#536b50';ctx.beginPath();ctx.arc(t.x,t.y-2,t.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#718366';ctx.beginPath();ctx.arc(t.x-5,t.y-6,t.r*.58,0,Math.PI*2);ctx.fill()}
// lamps
for(let x=250;x<1650;x+=145){ctx.fillStyle='#292e2d';ctx.fillRect(x,570,4,52);ctx.fillRect(x-8,565,20,6)}
// vehicles
for(const a of cars){ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.dir);ctx.fillStyle='#202424';ctx.fillRect(-20,-11,42,25);ctx.fillStyle=a.color;ctx.fillRect(-22,-13,44,23);ctx.fillStyle='#293b40';ctx.fillRect(-9,-10,19,17);ctx.fillStyle='#ddd5c1';ctx.fillRect(16,-8,5,5);ctx.restore()}
// player marker
ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.dir);ctx.fillStyle='#17232a';ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f3e6c9';ctx.beginPath();ctx.moveTo(17,0);ctx.lineTo(-7,-7);ctx.lineTo(-7,7);ctx.closePath();ctx.fill();ctx.restore();ctx.restore();
// vignette / cinematic edge
let g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'#00000000');g.addColorStop(1,'#17212655');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function tick(now){if(!paused){let dt=Math.min((now-last)/16.67,2.5);last=now;let f=-(stick.y+(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)),s=stick.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);let mag=Math.hypot(f,s);if(mag>1){f/=mag;s/=mag}if(mag>.04){player.x=Math.max(40,Math.min(world.w-40,player.x+s*3.1*dt));player.y=Math.max(40,Math.min(world.h-40,player.y+f*3.1*dt));player.dir=Math.atan2(-f,s)}draw();frames++;if(now-fpsT>1000){fps.textContent=Math.round(frames*1000/(now-fpsT))+' FPS · '+(quality===1?'High':'Performance');frames=0;fpsT=now}}requestAnimationFrame(tick)}
const pad=document.getElementById('pad'),nub=document.getElementById('nub');let padId=null;function setStick(e){const r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.min(42,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);stick.x=Math.cos(a)*m/42;stick.y=Math.sin(a)*m/42;nub.style.transform=`translate(${stick.x*38}px,${stick.y*38}px)`}pad.addEventListener('pointerdown',e=>{padId=e.pointerId;pad.setPointerCapture(e.pointerId);setStick(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===padId)setStick(e)});function endPad(e){if(e.pointerId===padId){padId=null;stick.x=stick.y=0;nub.style.transform=''}}pad.addEventListener('pointerup',endPad);pad.addEventListener('pointercancel',endPad);
const lookEl=document.getElementById('look');lookEl.addEventListener('pointerdown',e=>{look={id:e.pointerId,x:e.clientX,y:e.clientY};lookEl.setPointerCapture(e.pointerId)});lookEl.addEventListener('pointermove',e=>{if(look&&look.id===e.pointerId){player.dir+= (e.clientX-look.x)*.006;look.x=e.clientX;look.y=e.clientY}});['pointerup','pointercancel'].forEach(t=>lookEl.addEventListener(t,e=>{if(look&&look.id===e.pointerId)look=null}));addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==='Escape'){paused=!paused;document.getElementById('overlay').style.display=paused?'grid':'none'}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
document.getElementById('reset').onclick=()=>{player={x:900,y:1030,dir:-Math.PI/2};caption.textContent='Start point reset'};document.getElementById('quality').onclick=()=>{quality=quality===1?.65:1;document.getElementById('quality').textContent='Quality: '+(quality===1?'High':'Performance');resize()};document.getElementById('resume').onclick=()=>{paused=false;document.getElementById('overlay').style.display='none';last=performance.now();requestAnimationFrame(tick)};
c.addEventListener('pointerup',e=>{if(e.clientX<W*.45&&e.clientY>H*.5)return;const wx=player.x+(e.clientX-W/2),wy=player.y+(e.clientY-H/2);let nearest=landmarks.map(l=>({l,d:Math.hypot(wx-(l.x+l.w/2),wy-(l.y+l.h/2))})).sort((a,b)=>a.d-b.d)[0];if(nearest&&nearest.d<220)caption.textContent=nearest.l.name;});
resize();status.textContent='World ready';caption.textContent='Dealey Plaza · explore freely';requestAnimationFrame(tick);
})();</script></body></html>
